; Rescue band firmware. Two builds from one project:
;   pio run -e band   -t upload    the wearable band (ESP32 + RFM95W, LED, BOOT button)
;   pio run -e dongle -t upload    USB <-> LoRa passthrough for the laptop (needs a 2nd node)
;   pio run -e band_xiao_lora -t upload the same wristband with an RFM9x (LoRa) instead
;   pio run -e band_xiao -t upload the wristband: Seeed XIAO ESP32-S3 + RFM69HCW (FSK), button, buzzer, motor
;   pio run -e dog_feather -t upload the dog's radio: Feather 32u4 RFM9x, runs the near check itself
;   pio run -e feather_radio -t upload       Feather 32u4 RFM69 as the XIAO wristband's radio
;   pio run -e band_xiao_feather -t upload the XIAO wristband that uses that Feather
;   pio run -e dongle_fsk -t upload  laptop dongle on the FSK link the RFM69 wristband uses
; Pins and radio settings: include/config.h

[platformio]
default_envs = band

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@7.1.2
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall

[env:band]
build_src_filter = +<band/>

[env:dongle]
build_src_filter = +<dongle/>

[env:dongle_fsk]
build_src_filter = +<dongle/>
build_flags = ${env.build_flags} -DLINK_FSK

[env:band_xiao]
board = seeed_xiao_esp32s3
build_src_filter = +<band/>
build_flags = ${env.build_flags} -DBOARD_XIAO_S3 -DRADIO_RFM69 -DLINK_FSK
; PlatformIO's bundled esptool fails mid-upload on this board ("No serial data received").
; Flash with a current esptool instead (needs uv: https://docs.astral.sh/uv/). It finds the port itself.
upload_protocol = custom
upload_command = uv run --no-project --python 3.12 --with esptool==4.8.1 python -m esptool --chip esp32s3 --port "$UPLOAD_PORT" --baud 460800 write_flash -z --flash_mode dio --flash_freq 80m --flash_size detect 0x0 "$BUILD_DIR/bootloader.bin" 0x8000 "$BUILD_DIR/partitions.bin" 0xe000 "$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/partitions/boot_app0.bin" 0x10000 "$SOURCE"

[env:band_xiao_lora]
; Same wristband, same wires, RFM9x/RFM95W (LoRa) in place of the RFM69HCW: the radio is the only
; difference. Talks to the LoRa `dongle` env and the dog's Feather. Swap chip, pick this env.
extends = env:band_xiao
build_flags = ${env.build_flags} -DBOARD_XIAO_S3

[env:feather_radio]
; Feather 32u4 RFM69HCW as the XIAO wristband's radio modem (serial to the XIAO, FSK hopping).
platform = atmelavr@5.1.0
board = feather32u4
build_src_filter = +<feather/>
build_unflags =
build_flags = -Wall -Os -DLINK_FSK
lib_deps = jgromes/RadioLib@7.1.2

[env:band_xiao_feather]
; The XIAO wristband with its radio on a Feather 32u4 RFM69 (env feather_radio) over serial.
extends = env:band_xiao
build_flags = ${env.build_flags} -DBOARD_XIAO_S3 -DRADIO_FEATHER -DLINK_FSK

[env:dog_feather]
; Feather 32u4 RFM9x: 28 KB of program space, too small for RadioLib. Runs the lean SX1276 FSK
; driver in lib/sx1276_fsk, on the same FSK hopping link as the wristband and the dongle.
platform = atmelavr@5.1.0
board = feather32u4
build_src_filter = +<dog/>
build_unflags =
build_flags = -Wall -Os -DLINK_FSK
lib_deps =

[env:dog_feather_rfm69]
; Periodic discovery on the same Feather RFM69HCW used by the wristband.
; Requires pairing headers and #T clock sync. Each confirmed band is skipped for 2 h.
platform = atmelavr@5.1.0
board = feather32u4
build_src_filter = +<dog_beacon/>
build_unflags =
build_flags = -Wall -Os -DLINK_FSK
lib_deps = jgromes/RadioLib@7.1.2
